name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      # next.config.ts sets output: "export" and derives the /ab-innovations
      # basePath from GITHUB_REPOSITORY, so this writes the whole site to out/.
      - name: Build the Next.js site
        run: npm run build

      # The hand-built client demo sites and downloads live outside the Next
      # app. Copy them in without clobbering anything Next generated.
      - name: Add demo sites and downloads
        run: |
          for d in websites barber restaurant realtor product blog images; do
            [ -d "$d" ] && cp -Rn "$d" out/ || true
          done
          for f in resume.pdf privacy.html blog.html; do
            [ -f "$f" ] && cp -n "$f" out/ || true
          done
          touch out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
